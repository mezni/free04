[package]
name = "llmgw-gateway"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.54", features = ["full"] }
tower = "0.5.3"
tower-http = "0.7.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
redis = { version = "1.8.1", features = ["aio", "tokio-comp"] }
uuid = { version = "1.0", features = ["v7"] }
tokio-stream = "0.1.0"
futures = "0.3"