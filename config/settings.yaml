# Telco RAG configuration.
# Base values are read here; environment variables override (see config contract).

corpus:
  document_dir: data/documents

chunking:
  chunk_size: 500
  chunk_overlap: 50

retrieval:
  top_k: 4
  similarity_threshold: 0.0
  vector_db_path: data/chroma
  collection: telco_documents

embedding:
  provider: local-sentence-transformers
  model: BAAI/bge-small-en-v1.5

evaluation:
  dataset_path: data/evaluation/retrieval_questions.jsonl
  default_k: 5

llm:
  base_url: https://openrouter.ai/api/v1
  api_key: ""
  model: ""
  max_tokens: 512
  temperature: 0.0